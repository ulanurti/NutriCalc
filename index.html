<у!<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
    <title>NutriCalc</title>
</head>

<body>

    <h1>NutriCalc</h1>

    <p>Вес (кг):</p>
    <input id="weight" type="number">

    <p>Рост (см):</p>
    <input id="height" type="number">

    <p>Возраст (годы):</p>
    <input id="age" type="number">

    <p>Пол:</p>
    <select id="gender">
        <option value="female">Женщина</option>
        <option value="male">Мужчина</option>
    </select>

    <p>Талия (см):</p>
    <input id="waist" type="number">

    <p>Бёдра (см):</p>
    <input id="hips" type="number">

    <p>Плечи (см):</p>
    <input id="shoulders" type="number">


    <br><br>

    <button onclick="calculateBMI()">
        Рассчитать консультацию
    </button>

    <button onclick="calculateIdealWeight()">
        Рассчитать идеальный вес
    </button>

    <button onclick="showConsultation()">
        Показать историю
    </button>

    <button onclick="showGraph()">
        Показать график
    </button>


    <h2>Результаты:</h2>

    <p id="result"></p>

    <p id="idealWeight"></p>


    <h2>История измерений:</h2>

    <div id="history"></div>


    <script src="script.js"></script>

</body>

</html>
