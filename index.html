<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
    <title>NutriCalc</title>
</head>

<body>

    <p>Вес (кг):</p>
    <input id="weight">

    <p>Рост (см):</p>
    <input id="height">
    <p> Возраст (годы):</p>
    <input type="number" id="age"><br><br>

    <p>Пол:</p>
    <select id="gender">
        <option value="female">Женщина</option>
        <option value="male">Мужчина</option>
    </select>

    <p>Талия (см):</p>
    <input id="waist">

    <p>Бёдра (см):</p>
    <input id="hips">

    <p>Плечи (см):</p>
    <input id="shoulders">

    <button onclick="calculateIdealWeight()">
        Рассчитать идеальный вес
    </button>

    <button onclick="calculateBMI()">
        Рассчитать ИМТ
    </button>
    <button onclick="calculateBMR()">
Рассчитать основной обмен
</button>

    <button onclick="showConsultation()">
        Показать историю
    </button>

    <button onclick="showGraph()">
        Показать график
    </button>

    <p id="result"></p>

    <p id="idealWeight"></p>

    <p>История измерений:</p>
    <div id="history"></div>

    <script src="script.js"></script>

</body>

</html>
