<!DOCTYPE html>
<html>
<head>
<title>NutriCalc</title>
</head>

<body>
  
<p>Вес (кг):</p>
<input id="weight">

<p>Рост (см):</p>
<input id="height">
  
<p>Живот (см):</p>
<input id="waist">

<p>Бёдра (см):</p>
<input id="hips">

<p>Плечи (см):</p>
<input id="shoulders">
  
<button onclick="calculateBMI()">Рассчитать</button>
<button onclick="showHistory()">Показать историю</button>
  <button onclick="showGraph()">Показать график</button>
<p id="result"></p>
  <p>История измерений:</p>
<div id="history"></div>
<script>
  let consultation=[];
function calculateBMI() {
  let weight = Number(document.getElementById("weight").value);
  let height = Number(document.getElementById("height").value);
let waist = Number(document.getElementById("waist").value);
let hips = Number(document.getElementById("hips").value);
let shoulders = Number(document.getElementById("shoulders").value);
  height = height / 100;

  let bmi = weight / (height * height);
  let patient = {
    name: "",
    age: "",
    height: ""
    consultations: []
}
  patient.consultations.push({
    date: new Date(),
    weight: weight,
    waist: waist,
    hips: hips,
    shoulders: shoulders,
    bmi: bmi
});
 let result = "";

if (bmi < 18.5) {
  result = "Недостаточный вес";
}
else if (bmi < 25) {
  result = "Нормальный вес";
}
else if (bmi < 30) {
  result = "Избыточный вес";
}
else if (bmi < 35) {
  result = "Ожирение I степени";
}
else if (bmi < 40) {
  result = "Ожирение II степени";
}
else {
  result = "Ожирение III степени (морбидное ожирение)";
}

document.getElementById("result").innerHTML =
  "Ваш ИМТ: " + bmi.toFixed(1) + "<br>" +
  "Категория: " + result;
}
  function showconsultation() {
  let text = "";

  for (let i = 0; i < consultation.length; i++) {
    text = text + "Измерение " + (i + 1) + ": " + consultation[i].toFixed(1) + "<br>";
  }

  document.getElementById("consultation").innerHTML = text;
}

</script>

</body>
</html>
